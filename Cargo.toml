[workspace]
members = ["launcher", "session", "xtask"]
# The IronRDP fork is its own workspace; the session uses its crates by path.
exclude = ["third_party"]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "warn"
panic = "warn"
redundant_clone = "warn"
needless_collect = "warn"
inefficient_to_string = "warn"

[profile.release]
strip = "debuginfo"
lto = "thin"
