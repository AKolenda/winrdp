[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
description = "Win RDP's build, packaging and release tasks: cargo xtask <command>"
license = "AGPL-3.0-only"
publish = false

[lints]
workspace = true

[dependencies]
anyhow = "1"
md5 = { package = "md-5", version = "0.10" }
png = "0.18"
resvg = "0.45"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
