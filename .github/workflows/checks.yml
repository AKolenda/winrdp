name: Source checks
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check source and packaging metadata
        run: |
          python3 tests/recovery_tests.py
          python3 tests/command_error_checks.py
          python3 tests/notice_checks.py
          node --check frontend/app.js
          node website/build.mjs
          python3 scripts/check-release.py
          python3 -m py_compile scripts/*.py
      - name: Check packaging metadata against the freedesktop validators
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream desktop-file-utils
          appstreamcli validate packaging/io.winrdp.Next.metainfo.xml
          desktop-file-validate packaging/io.winrdp.Next.desktop

  # The session crate carries the connection-failure classification, the status
  # file the launcher reads and the window's own logic. None of it was compiled
  # by any workflow before, so a break reached master and a release tag unnoticed.
  session:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: session
      - name: Install session build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libxcb1-dev pkg-config
      - name: Test
        run: cargo test --manifest-path session/Cargo.toml --locked --lib
      - name: Lint
        run: cargo clippy --manifest-path session/Cargo.toml --locked --lib --tests -- -D warnings
