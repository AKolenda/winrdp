name: Source checks
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # The notice check resolves the session's IronRDP path dependencies.
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check release metadata, dependency notices and the website
        run: |
          cargo xtask check-release
          cargo xtask notices --check
          cargo xtask website
      - name: Check packaging metadata against the freedesktop validators
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream desktop-file-utils
          appstreamcli validate packaging/io.winrdp.Next.metainfo.xml
          desktop-file-validate packaging/io.winrdp.Next.desktop

  # The launcher, the session window (its connection-failure classification, the
  # status file the launcher reads) and xtask's packaging checks.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install build dependencies
        run: cargo xtask install-deps --yes
      - name: Install dependency checker
        run: cargo install cargo-machete --version 0.9.2 --locked
      - name: Check formatting, dependencies, lints, Rust docs and tests
        run: cargo xtask check

  # Check the exact fork revision shipped by the app, using its pinned toolchain.
  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: third_party/ironrdp
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./third_party/ironrdp/.github/actions/install-build-deps
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: third_party/ironrdp -> target
      - name: Check fork formatting and lints
        run: |
          cargo xtask check fmt -v
          cargo xtask check lints -v
      - name: Test protocol, framebuffer, transport and printer behavior
        run: |
          cargo test --locked \
            -p ironrdp-testsuite-core \
            -p ironrdp-testsuite-extra \
            -p ironrdp-rdpeudp \
            -p ironrdp-rdpdr-native
          # The fork disables automatic lib-test discovery for this crate.
          cargo test --locked -p ironrdp-client --features rustls,all --lib
