[package]
name = "winrdp-next"
version = "0.7.7"
edition = "2021"
description = "Win RDP launcher: a Tauri window that opens one IronRDP session process per remote desktop"
license = "AGPL-3.0-only"
publish = false

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
uuid = { version = "1", features = ["v4"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = "debuginfo"
lto = "thin"
