[package]
name = "winrdp-next"
version = "0.8.1"
edition = "2024"
description = "Win RDP launcher: a native iced window that opens one IronRDP session process per remote desktop"
license = "AGPL-3.0-only"
publish = false

[lints]
workspace = true

[dependencies]
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "svg", "tokio", "x11", "wayland", "crisp"] }
oo7 = { version = "0.6", default-features = false, features = ["tokio", "native_crypto"] }
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[dev-dependencies]
iced_test = "0.14"
